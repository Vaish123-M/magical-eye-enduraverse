version: '3.8'

services:
  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: magical-eye-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://magical_eye:magical_eye@postgres:5432/magical_eye}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
      - MODEL_PATH=${MODEL_PATH:-/app/model/exports/defect_model.onnx}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH:-/app/storage}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=${CACHE_ENABLED:-True}
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
    volumes:
      - ./backend:/app
      - ./model:/app/model
      - ./storage:/app/storage
    networks:
      - magical-eye-net
    depends_on:
      - postgres
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ───────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: magical-eye-celery-worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://magical_eye:magical_eye@postgres:5432/magical_eye}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_PATH=${MODEL_PATH:-/app/model/exports/defect_model.onnx}
    volumes:
      - ./backend:/app
      - ./model:/app/model
      - ./storage:/app/storage
    networks:
      - magical-eye-net
    depends_on:
      - postgres
      - redis
    command: celery -A app.worker worker --loglevel=info

  # ── Celery Beat (Scheduled Tasks) ────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: magical-eye-celery-beat
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://magical_eye:magical_eye@postgres:5432/magical_eye}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    networks:
      - magical-eye-net
    depends_on:
      - postgres
      - redis
    command: celery -A app.worker beat --loglevel=info

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: magical-eye-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - magical-eye-net
    command: redis-server --appendonly yes

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: magical-eye-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-magical_eye}
      - POSTGRES_USER=${POSTGRES_USER:-magical_eye}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-magical_eye}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - magical-eye-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magical_eye"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: magical-eye-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - magical-eye-net
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1
    command: npm run dev

  # ── Prometheus (Metrics) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: magical-eye-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - magical-eye-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ── Grafana (Visualization) ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: magical-eye-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - magical-eye-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}

networks:
  magical-eye-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
