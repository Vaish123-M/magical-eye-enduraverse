name: ML CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'model/**'
      - 'backend/tests/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'model/**'
      - 'backend/tests/**'

jobs:
  model-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-ml-pip-${{ hashFiles('model/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-ml-pip-
    
    - name: Install ML dependencies
      working-directory: ./model
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test model architecture
      working-directory: ./model
      run: |
        python -c "from model.architectures.defect_cnn import DefectClassifier; print('Model structure OK')"
    
    - name: Test evaluation script imports
      working-directory: ./model
      run: |
        python -c "import model.src.evaluate; print('Evaluation script imports OK')"
    
    - name: Test export script imports
      working-directory: ./model
      run: |
        python -c "import model.src.export_onnx; print('Export script imports OK')"

  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-backend-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-backend-pip-
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run inference tests
      working-directory: ./backend
      run: |
        pytest tests/test_inference.py -v --tb=short
    
    - name: Run API tests
      working-directory: ./backend
      run: |
        pytest tests/test_api.py -v --tb=short
    
    - name: Run CRUD tests
      working-directory: ./backend
      run: |
        pytest tests/test_crud.py -v --tb=short
